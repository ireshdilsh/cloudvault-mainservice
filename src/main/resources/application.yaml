spring:
  application:
    name: mainservice
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:50MB}
    
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cloudvault}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

server:
  servlet:
    context-path: /api
  max-http-request-header-size: 16KB

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:3000}
  storage:
    path: ${STORAGE_PATH:./cloudvault-storage}
    max-image-bytes: ${MAX_IMAGE_BYTES:10485760}
  subscription:
    free-limit-bytes: ${FREE_STORAGE_LIMIT_BYTES:10737418240}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:change-this-development-secret-key-at-least-32-bytes}
  expiration: ${JWT_EXPIRATION:86400000}
